name: Main Tag to Release PR

on:
  push:
    tags:
      - 'v*.*.*' # Match SemVer tags (vMAJOR.MINOR.PATCH)

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Create PR from main to release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate Release Notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_NOTES=$(gh api \
            -X POST \
            repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG_VERSION")

          BODY=$(echo "$RELEASE_NOTES" | jq -r '.body')

          delimiter="$(openssl rand -hex 8)"
          echo "release-notes<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: Create PR from main to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.notes.outputs.release-notes }}
        run: |
          echo "Creating PR for tag: $TAG_VERSION"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base release-test --head main --state open --json url --jq '.[0].url // empty')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base release-test \
              --head main \
              --title "Release: Merge main ($TAG_VERSION) to release" \
              --body "$RELEASE_NOTES"
          else
            echo "A PR from main to release already exists: $EXISTING_PR"
          fi
