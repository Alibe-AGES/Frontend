name: Main Tag to Release PR

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    name: Create PR from main to release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate Release Notes
        uses: RedCrafter07/release-notes-action@v1.0.1
        id: notes
        with:
          tag-name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR from main to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.notes.outputs.release-notes }}
        run: |
          echo "Creating PR for tag: $TAG_VERSION"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base release-test --head main --state open --json url --jq '.[0].url // empty')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base release-test \
              --head main \
              --title "Release: Merge main ($TAG_VERSION) to release" \
              --body "$RELEASE_NOTES"
          else
            echo "A PR from main to release already exists: $EXISTING_PR"
          fi
