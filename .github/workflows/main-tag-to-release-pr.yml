name: Main Tag to Release PR

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    name: Create PR from main to release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag version
        id: tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG_NAME"

      - name: Create PR from main to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION=${{ steps.tag.outputs.version }}

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base release --head main --state open --json url --jq '.[0].url // empty')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base release \
              --head main \
              --title "Release: Merge main ($TAG_VERSION) to release" \
              --body "## Release Notes
