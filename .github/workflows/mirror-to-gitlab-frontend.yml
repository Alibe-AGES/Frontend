name: Mirror to AGES GitLab (HTTPS)

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Only the latest state of main goes to GitLab, not its history, so only the last commit is needed.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Test Network Connectivity
        run: |
          echo "=== Network Diagnostics ==="
          echo "Testing basic connectivity..."
          ping -c 3 tools.ages.pucrs.br || echo "Ping failed"

          echo "Testing DNS resolution..."
          nslookup tools.ages.pucrs.br || echo "DNS lookup failed"

          echo "Testing HTTPS connectivity..."
          curl -I https://tools.ages.pucrs.br || echo "HTTPS connection failed"

      - name: Remove existing remote (if exists)
        run: |
          git remote remove gitlab || true

      - name: Add GitLab remote (HTTPS)
        run: |
          git remote add gitlab https://tools.ages.pucrs.br/2026-2/6lmnp/alibe/frontend.git
          git remote -v

      # GitLab rejects a push from a shallow clone when it lacks the parent commits, so the latest
      # state goes as a new commit with no parents. Each run replaces the history of main on GitLab.
      - name: Build a single-commit copy of main
        run: |
          source_sha=$(git rev-parse HEAD)
          git checkout --orphan gitlab-latest
          git commit --quiet -m "Mirror of ${source_sha} from GitHub main"
          git log --oneline -1
          echo "Objects to send: $(git count-objects -vH | grep size-pack)"

      # git only prints "403". The server sits behind Cloudflare, which can refuse the request before GitLab
      # sees it, so print who answered and why. git-upload-pack checks read access and git-receive-pack push
      # access. The requests use git's user agent, because Cloudflare refuses curl's own one.
      - name: Check GitLab access
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
        run: |
          user_agent="git/$(git --version | awk '{print $3}')"
          for service in git-upload-pack git-receive-pack; do
            echo "=== ${service}"
            curl -sS -A "${user_agent}" -o response.txt \
              -w "HTTP %{http_code} | server: %header{server} | cf-mitigated: %header{cf-mitigated}\n" \
              -u "${GITLAB_USERNAME}:${GITLAB_PASSWORD}" \
              "https://tools.ages.pucrs.br/2026-2/6lmnp/alibe/frontend.git/info/refs?service=${service}" || true
            head -c 400 response.txt | tr -c '[:print:]\n' '.'
            echo
          done

      - name: Push to GitLab
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
        run: |
          echo "Starting push to GitLab..."
          git remote set-url gitlab "https://${GITLAB_USERNAME}:${GITLAB_PASSWORD}@tools.ages.pucrs.br/2026-2/6lmnp/alibe/frontend.git"
          git push --force gitlab gitlab-latest:main
          echo "Push completed successfully"
