name: E2E Tests (Maestro) - Android

on:
  # The release runs the flows tagged `ci`; a failure blocks it.
  workflow_call:
    inputs:
      include-tags:
        type: string
        default: ci
  # Manual run from the Actions tab, to try flows that are not tagged `ci` yet without touching a release.
  workflow_dispatch:
    inputs:
      include-tags:
        description: 'Flow tags to run, comma-separated (e.g. groups,memories,experiences,auth). Leave "ci" for the release set.'
        type: string
        default: ci

env:
  # Same value for both triggers; `ci` when nothing is passed.
  E2E_TAGS: ${{ inputs.include-tags || 'ci' }}

jobs:
  # A tag list goes into shell commands, so only letters, digits, commas, hyphens and underscores pass.
  check-tags:
    name: Check Tags
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate include-tags
        run: |
          if ! printf '%s' "$E2E_TAGS" | grep -Eq '^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$'; then
            echo "::error::include-tags must be tag names separated by commas, without spaces. Got: $E2E_TAGS"
            exit 1
          fi
          echo "Running flows tagged: $E2E_TAGS" | tee -a "$GITHUB_STEP_SUMMARY"

  build-e2e-apk:
    # The EAS APK points to AWS, so the tests build their own APK for the Docker backend.
    name: Build E2E APK
    needs: check-tags
    uses: ./.github/workflows/local-build.yml
    with:
      artifact-name: app-e2e
      architectures: x86_64

  # Static report of what the flows cover (testIDs, screens, routes). It reads the code only,
  # so it runs alongside the APK build and its artifact is there even when a flow fails.
  selector-coverage:
    name: Maestro Selector Coverage
    needs: check-tags
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Measure selector coverage
        run: |
          mkdir -p e2e-coverage
          # `run` covers the flows this run executes (`ci` on a release); `all` also counts every other flow.
          node scripts/e2e-coverage.mjs --include-tags "$E2E_TAGS" --details --json e2e-coverage/run.json > e2e-coverage/run.txt
          node scripts/e2e-coverage.mjs --details --json e2e-coverage/all.json > e2e-coverage/all.txt
          {
            echo "## Maestro selector coverage (flows tagged \`${E2E_TAGS}\`)"
            echo '```'
            node scripts/e2e-coverage.mjs --include-tags "$E2E_TAGS"
            echo '```'
            echo '## Maestro selector coverage (all flows)'
            echo '```'
            node scripts/e2e-coverage.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload selector coverage
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-coverage-${{ github.run_number }}
          path: e2e-coverage
          if-no-files-found: error
          retention-days: 7

  maestro:
    name: Maestro
    needs: build-e2e-apk
    runs-on: ubuntu-latest
    # Stops a stuck run instead of waiting for GitHub's 6-hour job limit.
    timeout-minutes: 60
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-e2e
          path: ./artifacts

      - name: Find APK
        id: apk
        run: |
          APK=$(find ./artifacts -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Check Maestro
        run: maestro --version

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM is available. Enabling permissions..."
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "KVM is not available on this runner. Continuing without it."
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Alibe-AGES/Backend
          ref: develop
          path: backend

      - name: Start backend
        working-directory: backend
        run: docker compose -f infra/e2e/docker-compose.yml up -d --build --wait

      - name: Run Maestro E2E on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096
          disable-animations: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot-load
            -no-snapshot-save
            -gpu swiftshader_indirect
          script: |
            mkdir -p ./maestro-results

            echo "Installing APK on emulator..."
            adb install -r "${{ steps.apk.outputs.path }}"

            adb reverse tcp:3000 tcp:3000

            # The default emulator screen is too small for the app; 411x914 dp at low density keeps a phone
            # layout without slowing down the emulator, which draws on the CPU.
            adb shell wm size 411x914
            adb shell wm density 160

            echo "Starting Maestro E2E tests (tags: $E2E_TAGS)..."
            maestro test .maestro/ --include-tags "$E2E_TAGS" --test-output-dir=./maestro-results

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-results-${{ github.run_number }}
          path: ./maestro-results
          if-no-files-found: warn
          retention-days: 7

      - name: Backend logs
        if: failure()
        working-directory: backend
        run: docker compose -f infra/e2e/docker-compose.yml logs
