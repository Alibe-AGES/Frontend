name: E2E Tests (Maestro) - Android

on:
  workflow_call:

jobs:
  build-e2e-apk:
    # The release APK from EAS points to the AWS backend, so the tests use their own APK
    # that points to the Docker backend started below.
    name: Build E2E APK
    uses: ./.github/workflows/local-build.yml
    with:
      artifact-name: app-e2e
      architectures: x86_64

  maestro:
    name: Maestro
    needs: build-e2e-apk
    runs-on: ubuntu-latest
    # Stops a stuck run instead of waiting for GitHub's 6-hour job limit.
    timeout-minutes: 60
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-e2e
          path: ./artifacts

      - name: Find APK
        id: apk
        run: |
          APK=$(find ./artifacts -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Check Maestro
        run: maestro --version

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM is available. Enabling permissions..."
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "KVM is not available on this runner. Continuing without it."
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Alibe-AGES/Backend
          ref: develop
          path: backend

      - name: Start backend
        working-directory: backend
        run: docker compose -f infra/e2e/docker-compose.yml up -d --build --wait

      - name: Run Maestro E2E on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096
          disable-animations: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot-load
            -no-snapshot-save
            -gpu swiftshader_indirect
          script: |
            mkdir -p ./maestro-results

            echo "Installing APK on emulator..."
            adb install -r "${{ steps.apk.outputs.path }}"

            adb reverse tcp:3000 tcp:3000

            # The default emulator screen (320x640 dp) is smaller than any current phone, and the floating
            # navigation bar covers parts of the app. 411x914 dp matches the Pixel 8 the flows were written on;
            # the low density keeps the pixel count small, since this emulator draws every frame on the CPU.
            adb shell wm size 411x914
            adb shell wm density 160

            echo "Starting Maestro E2E tests..."
            maestro test .maestro/ --include-tags ci --test-output-dir=./maestro-results

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-results-${{ github.run_number }}
          path: ./maestro-results
          if-no-files-found: warn
          retention-days: 7

      - name: Backend logs
        if: failure()
        working-directory: backend
        run: docker compose -f infra/e2e/docker-compose.yml logs
