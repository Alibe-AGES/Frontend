name: E2E Tests (Maestro) - Android

on:
  workflow_call:

jobs:
  maestro:
    name: Maestro E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./artifacts

      - name: Find APK
        id: apk
        run: |
          APK=$(find ./artifacts -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Check Maestro
        run: maestro --version

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM is available. Enabling permissions..."
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "KVM is not available on this runner. Continuing without it."
          fi

      - name: Run Maestro E2E on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096
          disable-animations: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -gpu swiftshader_indirect
          script: |
            mkdir -p ./maestro-results

            echo "Installing APK on emulator..."
            adb install -r "${{ steps.apk.outputs.path }}"

            echo "Starting Maestro E2E tests..."
            maestro test .maestro/ --include-tags smoke --test-output-dir=./maestro-results

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-results-${{ github.run_number }}
          path: ./maestro-results
          if-no-files-found: warn
          retention-days: 7
