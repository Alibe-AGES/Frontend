name: Android APK - Local Build

on:
  workflow_call:
    inputs:
      artifact-name:
        # The E2E workflow passes "app-e2e" so its test APK never mixes with the EAS app-release.
        type: string
        default: app-release
      architectures:
        type: string
        default: ''
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # android/ only exists after prebuild, so the cache key comes from package-lock.json.
          cache: gradle
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: Set-Content -Path .env -Value "EXPO_PUBLIC_API_URL=http://localhost:3000" -Encoding utf8NoBOM

      - name: Expo Prebuild for Android
        run: npx expo prebuild --platform android --clean
        # This step generates the native Android project files in the android/ directory.

      - name: Compile Android APK
        working-directory: android
        run: |
          if ("${{ inputs.architectures }}") {
            .\gradlew assembleRelease "-PreactNativeArchitectures=${{ inputs.architectures }}"
          } else {
            .\gradlew assembleRelease
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'app-release' }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
