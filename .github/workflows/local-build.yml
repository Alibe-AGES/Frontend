name: Android APK - Local Build

on:
  workflow_call:
    inputs:
      artifact-name:
        # The release fallback keeps the default; the E2E workflow passes "app-e2e" so both can run in one release.
        type: string
        default: app-release
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        # The emulator reaches the Docker backend through adb reverse.
        # EAS builds ignore this file and use the URL set on expo.dev.
        run: Set-Content -Path .env -Value "EXPO_PUBLIC_API_URL=http://localhost:3000" -Encoding utf8NoBOM

      - name: Expo Prebuild for Android
        run: npx expo prebuild --platform android --clean
        # This step generates the native Android project files in the android/ directory.

      - name: Compile Android APK
        working-directory: android
        run: .\gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'app-release' }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
