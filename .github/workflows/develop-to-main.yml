name: Develop to Main

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-develop-to-main:
    name: Sync develop to main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require develop ref
        run: |
          test "$GITHUB_REF" = "refs/heads/develop"

      - name: Fetch main ref
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main

      - name: Update main to develop
        run: |
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          git push --force-with-lease=main:"$main_sha" origin "$GITHUB_SHA":refs/heads/main
