name: Develop to Main

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-develop-to-main:
    name: Sync develop to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or Sync Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists
          existing_pr=$(gh pr list --head develop --base main --state open --json number --jq '.[0].number')

          if [ -z "$existing_pr" ]; then
            echo "Creating Pull Request from develop to main..."
            gh pr create \
              --base main \
              --head develop \
              --title "chore: Sync develop to main" \
              --body "Automated daily sync from develop branch to main."
          else
            echo "Pull Request #$existing_pr already open."
          fi

      - name: Auto-merge PR (if checks pass)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge develop --auto --merge || true
