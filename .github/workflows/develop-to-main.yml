name: Develop to Main

on:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync-develop-to-main:
    name: Sync develop to main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch develop ref
        run: |
          git fetch origin refs/heads/develop:refs/remotes/origin/develop

      - name: Update main to develop
        run: |
          develop_sha="$(git rev-parse refs/remotes/origin/develop)"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git push --force-with-lease=refs/heads/main:"$main_sha" origin "$develop_sha":refs/heads/main
