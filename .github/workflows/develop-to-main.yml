name: Develop to Main

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-develop-to-main:
    name: Sync develop to main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into main
        run: |
          git fetch origin develop
          set +e
          git merge -X theirs --no-edit origin/develop
          merge_exit=$?
          set -e

          if [ -f .git/MERGE_HEAD ]; then
            unresolved_file_list="$(mktemp)"
            git diff --name-only --diff-filter=U > "$unresolved_file_list"

            while IFS= read -r path; do
              [ -n "$path" ] || continue

              if git ls-files -u -- "$path" | awk '{print $3}' | grep -q '^3$'; then
                git checkout --theirs -- "$path"
                git add -- "$path"
              else
                git rm -f -- "$path"
              fi
            done < "$unresolved_file_list"

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved merge conflicts remain after automatic develop-first resolution." >&2
              exit 1
            fi

            git commit --no-edit
          elif [ "$merge_exit" -ne 0 ]; then
            exit "$merge_exit"
          fi

      - name: Push updated main
        run: git push origin HEAD:main
