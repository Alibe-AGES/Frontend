name: Develop to Main

on:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync-develop-to-main:
    name: Sync develop to main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require develop ref
        run: |
          test "$GITHUB_REF" = "refs/heads/develop"

      - name: Update main to develop
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git push --force-with-lease=refs/heads/main:"$main_sha" origin "$GITHUB_SHA":refs/heads/main
