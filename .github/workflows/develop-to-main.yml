name: Develop to Main

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-develop-to-main:
    name: Sync develop to main
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch main and develop refs
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main refs/heads/develop:refs/remotes/origin/develop

      - name: Update main to develop
        run: |
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          git push --force-with-lease=main:"$main_sha" origin refs/remotes/origin/develop:refs/heads/main
