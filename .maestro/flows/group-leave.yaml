# Leave group flow: a new user creates a group, leaves it from the group info and is back to an empty groups screen.
# A new account keeps the check simple: after leaving its only group, the list is empty.
appId: com.alibe.app
tags: [groups]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/sign-up.yaml
- runFlow: ../subflows/create-group.yaml

- tapOn:
    id: group-screen-members
- extendedWaitUntil:
    visible:
      id: group-info-screen
    timeout: 30000
# The button is at the end of the screen, below the members and the invite link.
- scrollUntilVisible:
    element:
      id: group-info-leave
    direction: DOWN
    timeout: 10000
- tapOn:
    id: group-info-leave

# "Cancelar" closes the dialog and keeps the user in the group.
- extendedWaitUntil:
    visible:
      id: leave-group-dialog
    timeout: 10000
- tapOn:
    id: leave-group-cancel
- extendedWaitUntil:
    visible:
      id: group-info-screen
    timeout: 10000
- assertNotVisible:
    id: leave-group-dialog

- scrollUntilVisible:
    element:
      id: group-info-leave
    direction: DOWN
- tapOn:
    id: group-info-leave
- extendedWaitUntil:
    visible:
      id: leave-group-dialog
    timeout: 10000
- tapOn:
    id: leave-group-confirm

- extendedWaitUntil:
    visible:
      id: groups-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: alibe-groups-list-empty
    timeout: 30000
