# Suggestion flow: suggests a place in a new group, reaches the match screen and goes back to the group.
appId: com.alibe.app
tags: [ci, events]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/login.yaml
# A new group has only the logged user, whose own "yes" already matches everyone.
- runFlow: ../subflows/create-group.yaml

- evalScript: ${output.suggestionName = 'Sugestão E2E ' + Date.now()}
- tapOn:
    id: alibe-navigation-bar-create
- extendedWaitUntil:
    visible:
      id: create-event-tab-suggestion
    timeout: 10000
- tapOn:
    id: create-event-tab-suggestion
- scrollUntilVisible:
    element:
      id: create-event-card-name-input
    direction: DOWN
- tapOn:
    id: create-event-card-name-input
- inputText: ${output.suggestionName}
# Small screens can hide fields and buttons below the fold or behind the keyboard,
# so close the keyboard and scroll to each element before using it.
- runFlow: ../subflows/close-keyboard.yaml
# The suggestion card is taller, so typing the name scrolls the address field out of view.
- scrollUntilVisible:
    element:
      id: create-event-card-address-input
    direction: UP
    timeout: 10000
- tapOn:
    id: create-event-card-address-input
- inputText: Rua dos Testes, 123
- runFlow: ../subflows/close-keyboard.yaml
- scrollUntilVisible:
    element:
      id: create-event-card-confirm
    direction: DOWN
    timeout: 10000
- tapOn:
    id: create-event-card-confirm

- extendedWaitUntil:
    visible:
      id: match-screen
    timeout: 30000
- assertVisible:
    id: match-headline
# The creator, the only member, is listed once the participants load. The list container is there while
# loading too, so wait for the participant itself, by its testID (user uuid).
- extendedWaitUntil:
    visible:
      id: 'match-participant-[0-9a-f-]{36}'
    timeout: 30000
# The buttons are no longer pinned to the bottom: they sit below the hi-five artwork, which can push
# them below the fold on small screens, so scroll to each one before using it.
- scrollUntilVisible:
    element:
      id: match-create-event
    direction: DOWN
- assertVisible:
    id: match-create-event

# "Voltar a tela inicial" leaves the match screen and returns to the group calendar.
- scrollUntilVisible:
    element:
      id: dismiss-match-create-event
    direction: DOWN
- tapOn:
    id: dismiss-match-create-event
- extendedWaitUntil:
    visible:
      id: group-screen
    timeout: 30000
