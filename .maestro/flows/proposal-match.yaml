# Suggestion flow: suggests a place in a new group and sees the confirmation that it was sent.
appId: com.alibe.app
tags: [ci, events]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/login.yaml
- runFlow: ../subflows/create-group.yaml

- evalScript: ${output.suggestionName = 'Sugestão E2E ' + Date.now()}
- tapOn:
    id: alibe-navigation-bar-create
- extendedWaitUntil:
    visible:
      id: create-event-tab-suggestion
    timeout: 10000
- tapOn:
    id: create-event-tab-suggestion
- scrollUntilVisible:
    element:
      id: create-event-card-name-input
    direction: DOWN
- tapOn:
    id: create-event-card-name-input
- inputText: ${output.suggestionName}
# Small screens can hide fields and buttons below the fold or behind the keyboard,
# so close the keyboard and scroll to each element before using it.
- runFlow: ../subflows/close-keyboard.yaml
# The suggestion card is taller, so typing the name scrolls the address field out of view.
- scrollUntilVisible:
    element:
      id: create-event-card-address-input
    direction: UP
    timeout: 10000
- tapOn:
    id: create-event-card-address-input
- inputText: Rua dos Testes, 123
- runFlow: ../subflows/close-keyboard.yaml
- scrollUntilVisible:
    element:
      id: create-event-card-confirm
    direction: DOWN
    timeout: 10000
- tapOn:
    id: create-event-card-confirm

# The screen stays open after sending: it shows a toast and clears the form.
- extendedWaitUntil:
    visible: 'Sugestão enviada!'
    timeout: 30000
- assertVisible: '${output.suggestionName} foi sugerido para o grupo.'
