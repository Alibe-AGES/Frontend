# Creates a group and opens it. Start it from the groups screen, after using login.yaml.
appId: com.alibe.app
---
- evalScript: ${output.groupName = 'Grupo E2E ' + Date.now()}
- tapOn:
    id: create-group-button
- extendedWaitUntil:
    visible:
      id: create-group-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: create-group-name
    direction: DOWN
- tapOn:
    id: create-group-name
- inputText: ${output.groupName}
# Small screens can hide the button below the fold or behind the keyboard.
- runFlow: close-keyboard.yaml
- scrollUntilVisible:
    element:
      id: create-group-continue
    direction: DOWN
- tapOn:
    id: create-group-continue

- extendedWaitUntil:
    visible:
      id: invite-group-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: alibe-invite-link
    timeout: 30000
- scrollUntilVisible:
    element:
      id: invite-group-continue
    direction: DOWN
- tapOn:
    id: invite-group-continue

- extendedWaitUntil:
    visible:
      id: groups-screen
    timeout: 30000
- runFlow:
    file: open-group.yaml
    env:
      NAME: ${output.groupName}
- extendedWaitUntil:
    visible:
      id: group-screen
    timeout: 30000
