# Opens the group named NAME from the groups screen.
# The list scrolls below a fixed header, and scrollUntilVisible swipes from the middle of the screen, which is the
# header on small screens. So swipe inside the list area until the group shows up.
appId: com.alibe.app
---
- repeat:
    while:
      notVisible: ${NAME}
    times: 30
    commands:
      - swipe:
          start: '50%, 85%'
          end: '50%, 55%'
          duration: 400
- tapOn: ${NAME}
